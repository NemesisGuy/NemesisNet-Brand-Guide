<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.06);
    --text-color: #F4F4F4;
    --ui-radius: 12px;
}
body {
    background: #0a0e27;
    color: #F4F4F4;
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
}
.menu-toggle {
    display: none;
    flex-direction: column;
    justify-content: space-around;
    width: 40px;
    height: 40px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    cursor: pointer;
    padding: 8px;
}
.menu-toggle-icon {
    width: 100%;
    height: 2px;
    background: #F4F4F4;
    border-radius: 2px;
}
@media (max-width: 1024px) {
    .menu-toggle {
        display: flex !important;
    }
}
</style>
</head>
<body>
<h1>Burger Menu Test</h1>
<p>Window width: <span id="w"></span>px</p>
<p>If width is under 1024px, you should see the burger menu below:</p>
<button class="menu-toggle">
    <span class="menu-toggle-icon"></span>
    <span class="menu-toggle-icon"></span>
    <span class="menu-toggle-icon"></span>
</button>
<script>
setInterval(() => document.getElementById('w').textContent = window.innerWidth, 100);
</script>
</body>
</html>
